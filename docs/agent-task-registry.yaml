# Canonical machine-readable task registry for AI agents.
# Single source of truth for status, dependencies, and ownership.

meta:
  project: CarBall
  source_plan: docs/implementation-plan-parallel.md
  version: 2
  last_updated: 2026-03-01T08:40:00Z
  allowed_statuses: [TODO, IN_PROGRESS, BLOCKED, DONE]
  allowed_priorities: [P0, P1, P2]
  status_flow:
    - TODO -> IN_PROGRESS
    - IN_PROGRESS -> DONE
    - IN_PROGRESS -> BLOCKED
    - BLOCKED -> IN_PROGRESS

agent_edit_rules:
  - Never rename task IDs.
  - Only update fields for tasks you touch.
  - Update `meta.last_updated` on every change.
  - If setting BLOCKED, include `blocked_by` and `unblock_plan`.
  - If setting DONE, include `completed_at` and `evidence`.
  - Keep YAML valid; do not convert to another format.

